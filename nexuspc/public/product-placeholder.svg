<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#18181b"/>
  <rect x="1" y="1" width="398" height="398" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- subtle grid -->
  <line x1="0" y1="133" x2="400" y2="133" stroke="#27272a" stroke-width="0.5"/>
  <line x1="0" y1="266" x2="400" y2="266" stroke="#27272a" stroke-width="0.5"/>
  <line x1="133" y1="0" x2="133" y2="400" stroke="#27272a" stroke-width="0.5"/>
  <line x1="266" y1="0" x2="266" y2="400" stroke="#27272a" stroke-width="0.5"/>

  <!-- circuit board paths -->
  <g stroke="#3f3f46" stroke-width="1.5" fill="none">
    <path d="M60 200 L120 200 L120 160 L180 160"/>
    <path d="M180 160 L180 130 L240 130"/>
    <path d="M240 200 L320 200 L320 240 L360 240"/>
    <path d="M200 240 L200 300 L160 300 L160 340"/>
    <path d="M240 300 L280 300 L280 260"/>
    <path d="M120 260 L80 260 L80 320"/>
  </g>

  <!-- circuit nodes -->
  <g fill="#52525b">
    <circle cx="180" cy="160" r="4"/>
    <circle cx="240" cy="130" r="4"/>
    <circle cx="240" cy="200" r="4"/>
    <circle cx="200" cy="240" r="4"/>
    <circle cx="280" cy="260" r="4"/>
    <circle cx="160" cy="300" r="4"/>
  </g>

  <!-- center chip -->
  <rect x="155" y="155" width="90" height="90" rx="4" fill="#27272a" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- chip pins -->
  <g stroke="#52525b" stroke-width="2">
    <line x1="165" y1="155" x2="165" y2="148"/>
    <line x1="180" y1="155" x2="180" y2="148"/>
    <line x1="195" y1="155" x2="195" y2="148"/>
    <line x1="210" y1="155" x2="210" y2="148"/>
    <line x1="225" y1="155" x2="225" y2="148"/>
    <line x1="165" y1="245" x2="165" y2="252"/>
    <line x1="180" y1="245" x2="180" y2="252"/>
    <line x1="195" y1="245" x2="195" y2="252"/>
    <line x1="210" y1="245" x2="210" y2="252"/>
    <line x1="225" y1="245" x2="225" y2="252"/>
    <line x1="155" y1="165" x2="148" y2="165"/>
    <line x1="155" y1="180" x2="148" y2="180"/>
    <line x1="155" y1="195" x2="148" y2="195"/>
    <line x1="155" y1="210" x2="148" y2="210"/>
    <line x1="155" y1="225" x2="148" y2="225"/>
    <line x1="245" y1="165" x2="252" y2="165"/>
    <line x1="245" y1="180" x2="252" y2="180"/>
    <line x1="245" y1="195" x2="252" y2="195"/>
    <line x1="245" y1="210" x2="252" y2="210"/>
    <line x1="245" y1="225" x2="252" y2="225"/>
  </g>
  <!-- chip inner -->
  <rect x="170" y="170" width="60" height="60" rx="2" fill="#1c1c1f" stroke="#6d28d9" stroke-width="1"/>
  <text x="200" y="204" font-family="monospace" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">NPC</text>

  <!-- corner marks -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M20 20 L20 40 L40 40"/>
    <path d="M380 20 L380 40 L360 40"/>
    <path d="M20 380 L20 360 L40 360"/>
    <path d="M380 380 L380 360 L360 360"/>
  </g>
</svg>
